<!DOCTYPE html>
<html>
<head>
  <title>Admin Token Getter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #0a0e1a; color: #fff; padding: 20px; font-family: sans-serif; }
    input { width: 100%; padding: 15px; margin: 10px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; }
    button { width: 100%; padding: 15px; background: #00f5ff; color: #000; font-weight: bold; border: none; border-radius: 8px; }
    .token-box { background: #111; padding: 20px; border-radius: 8px; margin-top: 20px; word-break: break-all; border: 1px solid #00f5ff; }
    .copy-btn { background: #9c27b0; color: #fff; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Admin Token Getter</h2>
  
  <div id="loginForm">
    <input type="email" id="email" placeholder="Email" value="propredict.support@gmail.com">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Get Token</button>
  </div>
  
  <div id="tokenDisplay" style="display:none;">
    <p>✅ Your Token:</p>
    <div class="token-box" id="tokenValue"></div>
    <button class="copy-btn" onclick="copyToken()">Copy Token</button>
    <button onclick="goToAdmin()" style="margin-top:10px;">Go to Admin Panel</button>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.token) {
          document.getElementById('tokenValue').textContent = data.token;
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('tokenDisplay').style.display = 'block';
          
          // Save to localStorage
          localStorage.setItem('propredict_token', data.token);
          localStorage.setItem('token', data.token);
        } else {
          alert('Login failed: ' + JSON.stringify(data));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
    
    function copyToken() {
      const token = document.getElementById('tokenValue').textContent;
      navigator.clipboard?.writeText(token);
      alert('Token copied!');
    }
    
    function goToAdmin() {
      const token = document.getElementById('tokenValue').textContent;
      window.location.href = '/admin.html?token=' + encodeURIComponent(token);
    }
  </script>
</body>
</html>
