<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ProPredict — Multi‑Sport Probability Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font for Premium Feel -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- ✅ ORIGINAL BASE STYLES -->
  <link rel="stylesheet" href="styles.css">

  <!-- ✅ V2 PREMIUM REDESIGN LAYER (SAFE OVERRIDE) -->
  <link rel="stylesheet" href="styles-v2.css">

</head>

<body class="sportsbook-layout">

  <!-- ===================================================== -->
  <!-- STICKY HEADER -->
  <!-- ===================================================== -->

  <header class="header sportsbook-header">

    <div class="header-left">
      <div class="logo">
        <h1>ProPredict</h1>
        <span class="subtitle">
          Multi‑Sport Probability Intelligence Platform
        </span>
      </div>
    </div>

    <div class="header-right">

      <div class="controls">

        <div class="control-group">
          <label for="sportSelect">Sport</label>
          <select id="sportSelect">
            <option value="football">Football</option>
            <option value="basketball">Basketball</option>
            <option value="nfl">NFL</option>
            <option value="nhl">NHL</option>
            <option value="rugbyleague">Rugby League</option>
            <option value="rugbyunion">Rugby Union</option>
            <option value="mlb">MLB</option>
            <option value="tennis">Tennis</option>
            <option value="darts">Darts</option>
            <option value="tabletennis">Table Tennis</option>
          </select>
        </div>

        <div class="control-group">
          <label for="competitionSelect">Competition</label>
          <select id="competitionSelect">
            <option value="PL">Premier League</option>
            <option value="PD">La Liga</option>
            <option value="SA">Serie A</option>
            <option value="BL1">Bundesliga</option>
            <option value="FL1">Ligue 1</option>
          </select>
        </div>

        <div class="control-group toggle-group">
          <label for="eliteToggle">Elite Picks</label>
          <input type="checkbox" id="eliteToggle">
        </div>

        <!-- ✅ THEME TOGGLE (UNCHANGED) -->
        <div class="control-group theme-toggle-group">
          <label for="themeToggleBtn">Theme</label>
          <button id="themeToggleBtn" class="theme-toggle-btn">
            🌙 Dark
          </button>
        </div>

      </div>

      <!-- ===================================================== -->
      <!-- ✅ AUTHENTICATION / SUBSCRIPTION CONTROLS (NEW) -->
      <!-- ===================================================== -->

      <div class="auth-controls">

        <div id="userStatus" class="user-status">
          <span id="userRoleBadge" class="role-badge role-free">
            FREE
          </span>
        </div>

        <button id="loginBtn" class="btn-primary">
          Login
        </button>

        <button id="upgradeBtn" class="btn-secondary" style="display:none;">
          Upgrade
        </button>

        <button id="logoutBtn" class="btn-secondary" style="display:none;">
          Logout
        </button>

      </div>

    </div>

  </header>
  <!-- ===================================================== -->
  <!-- ✅ AUTH MODAL (LOGIN / REGISTER) -->
  <!-- ===================================================== -->

  <div id="authModal" class="modal-overlay hidden">

    <div class="modal-box">

      <button id="closeAuthModal" class="modal-close">✕</button>

      <h2 id="authModalTitle">Login</h2>

      <form id="authForm" class="auth-form">

        <div class="form-group">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" required />
        </div>

        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" required />
        </div>

        <button type="submit" class="btn-primary">
          Submit
        </button>

      </form>

      <div class="auth-switch">
        <span id="switchAuthMode">
          Don't have an account? Register
        </span>
      </div>

      <div id="authMessage" class="auth-message"></div>

    </div>

  </div>

  <!-- ===================================================== -->
  <!-- ✅ SUBSCRIPTION MODAL -->
  <!-- ===================================================== -->

  <div id="subscriptionModal" class="modal-overlay hidden">

    <div class="modal-box">

      <button id="closeSubscriptionModal" class="modal-close">✕</button>

      <h2>Upgrade Subscription</h2>

      <div class="subscription-plans">

        <div class="plan-card">
          <h3>Pro Monthly</h3>
          <p>₦5,000 / month</p>
          <button class="btn-primary"
                  data-tier="pro"
                  data-interval="monthly">
            Subscribe
          </button>
        </div>

        <div class="plan-card">
          <h3>Pro Yearly</h3>
          <p>₦50,000 / year</p>
          <button class="btn-primary"
                  data-tier="pro"
                  data-interval="yearly">
            Subscribe
          </button>
        </div>

        <div class="plan-card">
          <h3>VVIP Monthly</h3>
          <p>₦10,000 / month</p>
          <button class="btn-primary"
                  data-tier="vvip"
                  data-interval="monthly">
            Subscribe
          </button>
        </div>

        <div class="plan-card">
          <h3>VVIP Yearly</h3>
          <p>₦100,000 / year</p>
          <button class="btn-primary"
                  data-tier="vvip"
                  data-interval="yearly">
            Subscribe
          </button>
        </div>

      </div>

      <div id="subscriptionMessage" class="auth-message"></div>

    </div>

  </div>

  <!-- ===================================================== -->
  <!-- SCRIPT -->
  <!-- ===================================================== -->

  <script src="script.js"></script>

</body>
</html>
