<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProPredict — Football Probability Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="header">
    <div class="container header-content">
        <div class="logo">
            ProPredict
        </div>

        <div class="league-selector">
            <label for="leagueSelect">League</label>
            <select id="leagueSelect">
                <option value="PL">Premier League</option>
                <option value="PD">La Liga</option>
                <option value="BL1">Bundesliga</option>
                <option value="SA">Serie A</option>
                <option value="FL1">Ligue 1</option>
            </select>
        </div>
    </div>
</header>

<main class="container main-content">

    <!-- ========================= -->
    <!-- TOP PICKS -->
    <!-- ========================= -->
    <section class="section">
        <div class="section-header">
            <h2>Today's High Confidence Projections</h2>
            <span id="cacheStatus" class="cache-status"></span>
        </div>

        <div id="topPicksContainer" class="cards-grid"></div>
    </section>

    <!-- ========================= -->
    <!-- PROBABILITY ACCUMULATOR -->
    <!-- ========================= -->
    <section class="section">
        <div class="section-header">
            <h2>Probability Accumulator</h2>
        </div>

        <div class="builder-panel">

            <div id="builderSelections" class="builder-selections">
                <p class="builder-empty">No selections added.</p>
            </div>

            <div class="builder-summary">
                <div class="builder-row">
                    <span>Combined Probability</span>
                    <span id="combinedProbability">0%</span>
                </div>

                <div class="builder-row">
                    <span>Implied Fair Odds</span>
                    <span id="combinedOdds">-</span>
                </div>

                <div class="builder-row">
                    <span>Risk Level</span>
                    <span id="riskLevel">-</span>
                </div>

                <button id="clearBuilderBtn" class="clear-builder-btn">
                    Clear Selections
                </button>
            </div>

        </div>
    </section>

    <!-- ========================= -->
    <!-- TEAM ANALYSIS -->
    <!-- ========================= -->
    <section class="section">
        <div class="section-header">
            <h2>Team Analysis</h2>
        </div>

        <div class="team-analysis-controls">
            <select id="teamSelect">
                <option value="">Select Team</option>
            </select>
            <button id="analyzeBtn">Analyze</button>
        </div>

        <div id="analysisPanel" class="analysis-panel hidden">

            <div class="analysis-block">
                <h3>Full Time Markets</h3>
                <div id="fullTimeGrid" class="analysis-grid"></div>
            </div>

            <div class="analysis-block">
                <h3>First Half Markets</h3>
                <div id="firstHalfGrid" class="analysis-grid"></div>
            </div>

        </div>
    </section>

</main>

<footer class="footer">
    <div class="container">
        <p>ProPredict — Analytical Football Probability Engine</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
        </html>
