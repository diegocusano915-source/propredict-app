<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProPredict — Football Probability Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                ProPredict
            </div>

            <div class="league-selector">
                <label for="leagueSelect">League</label>
                <select id="leagueSelect">
                    <option value="PL">Premier League</option>
                    <option value="PD">La Liga</option>
                    <option value="BL1">Bundesliga</option>
                    <option value="SA">Serie A</option>
                    <option value="FL1">Ligue 1</option>
                </select>
            </div>
        </div>
    </header>


    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->
    <main class="container main-content">

        <!-- ========================= -->
        <!-- SECTION 1: TOP PROJECTIONS -->
        <!-- ========================= -->
        <section class="section">
            <div class="section-header">
                <h2>Today's High Confidence Projections</h2>
                <span id="cacheStatus" class="cache-status"></span>
            </div>

            <div id="topPicksContainer" class="cards-grid">
                <!-- Cards dynamically injected here -->
            </div>
        </section>


        <!-- ========================= -->
        <!-- SECTION 2: TEAM ANALYSIS -->
        <!-- ========================= -->
        <section class="section">
            <div class="section-header">
                <h2>Team Analysis</h2>
            </div>

            <div class="team-analysis-controls">
                <input 
                    type="number" 
                    id="teamIdInput" 
                    placeholder="Enter Team ID"
                    min="1"
                />
                <button id="analyzeBtn">Analyze</button>
            </div>

            <!-- ANALYSIS PANEL -->
            <div id="analysisPanel" class="analysis-panel hidden">

                <!-- FULL TIME -->
                <div class="analysis-block">
                    <h3>Full Time Markets</h3>
                    <div id="fullTimeGrid" class="analysis-grid">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- FIRST HALF -->
                <div class="analysis-block">
                    <h3>First Half Markets</h3>
                    <div id="firstHalfGrid" class="analysis-grid">
                        <!-- Populated dynamically -->
                    </div>
                </div>

            </div>
        </section>

    </main>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->
    <footer class="footer">
        <div class="container">
            <p>ProPredict — Analytical Football Probability Engine</p>
        </div>
    </footer>


    <!-- ========================= -->
    <!-- SCRIPT -->
    <!-- ========================= -->
    <script src="script.js"></script>
</body>
              </html>
