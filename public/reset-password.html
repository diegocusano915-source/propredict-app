<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ProPredict</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300f5ff'/%3E%3Cstop offset='100%25' stop-color='%239c27b0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%230a0e1a'/%3E%3Ctext x='50' y='70' font-size='54' font-weight='bold' font-family='Arial' text-anchor='middle' fill='url(%23g)'%3EPP%3C/text%3E%3C/svg%3E">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-v2.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #1a1040, #0a0e1a 50%, #050810 90%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 25, 45, 0.75);
      backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00f5ff, #9c27b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #a0b3d9;
      margin-bottom: 30px;
      font-size: 14px;
    }
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      margin-bottom: 16px;
      color: #00f5ff;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #dce5f2;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #00f5ff;
    }
    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00f5ff, #9c27b0);
      border: none;
      border-radius: 14px;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      display: block;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      display: block;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #a0b3d9;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link a:hover {
      color: #00f5ff;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="logo">⚡ ProPredict</div>
    <div class="subtitle">Reset your password</div>

    <!-- Step 1: Request Reset -->
    <div id="step1" class="step active">
      <h2>Forgot Password?</h2>
      <p style="color: #a0b3d9; margin-bottom: 24px;">Enter your email and we'll send you a reset link.</p>
      
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="Enter your email" required>
      </div>
      
      <button class="btn" onclick="requestReset()">Send Reset Link</button>
      
      <div class="back-link">
        <a href="/">← Back to Login</a>
      </div>
    </div>

    <!-- Step 2: New Password -->
    <div id="step2" class="step">
      <h2>Create New Password</h2>
      <p style="color: #a0b3d9; margin-bottom: 24px;">Enter your new password below.</p>
      
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required>
      </div>
      
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
      </div>
      
      <button class="btn" onclick="updatePassword()">Update Password</button>
      
      <div class="back-link">
        <a href="/">← Back to Login</a>
      </div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://veyydrngucgtnwqffnew.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZleXlkcm5ndWNndG53cWZmbmV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDYwNzcsImV4cCI6MjA5MTcyMjA3N30.PFSkDWntIx0eVMZCfto6SVyQY6yv_GfI2NaK1l2UVM8';

    // Check if we have a token in URL (from email link)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const type = urlParams.get('type');
    
    if (token && type === 'recovery') {
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
    }

    // Pre-fill email from URL
    const emailParam = urlParams.get('email');
    if (emailParam) {
      document.getElementById('resetEmail').value = emailParam;
    }

    async function requestReset() {
      const email = document.getElementById('resetEmail').value;
      const msg = document.getElementById('message');
      
      if (!email) {
        msg.className = 'message error';
        msg.textContent = 'Please enter your email address.';
        return;
      }

      try {
        msg.className = 'message';
        msg.textContent = 'Sending reset link...';
        msg.style.display = 'block';
        msg.style.color = '#a0b3d9';
        
        const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            redirect_to: 'https://propredict-app.onrender.com/reset-password.html'
          })
        });

        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = '✅ Reset link sent! Check your email.';
        } else {
          const err = await res.json();
          msg.className = 'message error';
          msg.textContent = '❌ ' + (err.msg || 'Failed to send reset link.');
        }
      } catch (e) {
        msg.className = 'message error';
        msg.textContent = '❌ Network error. Please try again.';
      }
    }

    async function updatePassword() {
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('message');
      
      if (!newPass || !confirmPass) {
        msg.className = 'message error';
        msg.textContent = 'Please fill in both fields.';
        return;
      }

      if (newPass !== confirmPass) {
        msg.className = 'message error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      if (newPass.length < 8) {
        msg.className = 'message error';
        msg.textContent = 'Password must be at least 8 characters.';
        return;
      }

      if (!token) {
        msg.className = 'message error';
        msg.textContent = 'Invalid reset link. Please request a new one.';
        return;
      }

      try {
        msg.className = 'message';
        msg.textContent = 'Updating password...';
        msg.style.display = 'block';
        msg.style.color = '#a0b3d9';

        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password: newPass })
        });

        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = '✅ Password updated! Redirecting to login...';
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          const err = await res.json();
          msg.className = 'message error';
          msg.textContent = '❌ ' + (err.msg || 'Failed to update password.');
        }
      } catch (e) {
        msg.className = 'message error';
        msg.textContent = '❌ Network error. Please try again.';
      }
    }
  </script>
</body>
  </html>
