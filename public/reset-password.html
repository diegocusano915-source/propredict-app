<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ProPredict</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-v2.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #1a1040, #0a0e1a 50%, #050810 90%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 25, 45, 0.75);
      backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00f5ff, #9c27b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #a0b3d9;
      margin-bottom: 30px;
      font-size: 14px;
    }
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      margin-bottom: 16px;
      color: #00f5ff;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #dce5f2;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #00f5ff;
    }
    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00f5ff, #9c27b0);
      border: none;
      border-radius: 14px;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 245, 255, 0.3);
    }
    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      display: block;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      display: block;
    }
    .message.info {
      background: rgba(0, 245, 255, 0.1);
      border: 1px solid rgba(0, 245, 255, 0.3);
      color: #00f5ff;
      display: block;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #a0b3d9;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link a:hover {
      color: #00f5ff;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="logo">⚡ ProPredict</div>
    <div class="subtitle">Reset your password</div>

    <h2>Forgot Password?</h2>
    <p style="color: #a0b3d9; margin-bottom: 24px;">Enter your email and we'll send you a reset link.</p>
    
    <form id="resetForm" method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" id="resetEmail" placeholder="Enter your email" required>
      </div>
      
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    
    <div id="message" class="message"></div>
    
    <div class="back-link">
      <a href="/">← Back to Login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const messageDiv = document.getElementById('message');
    
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('resetEmail').value;
      
      if (!email) {
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Please enter your email address.';
        return;
      }
      
      messageDiv.className = 'message info';
      messageDiv.textContent = 'Sending reset link...';
      
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          messageDiv.className = 'message success';
          messageDiv.textContent = '✅ Reset link sent! Check your email (including spam).';
          form.reset();
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ ' + (data.error || 'Failed to send reset link.');
        }
      } catch (e) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
