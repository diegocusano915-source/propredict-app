<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tips & Predictions — ProPredict</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    header {
      background: #111827;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #16a34a;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .back-btn {
      padding: 8px 16px;
      background: #1e293b;
      color: #94a3b8;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: #22c55e;
      color: #000;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .filter-tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 25px;
      padding-bottom: 10px;
    }

    .filter-tab {
      padding: 8px 16px;
      background: #1e293b;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: 0.2s;
      border: none;
      color: #94a3b8;
    }

    .filter-tab:hover,
    .filter-tab.active {
      background: #22c55e;
      color: #000;
    }

    .prediction-card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .prediction-card:hover {
      border-color: #334155;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-date {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-recap {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .badge-preview {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .badge-weekend {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }

    .card-match {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-league {
      font-size: 12px;
      color: #22c55e;
      margin-bottom: 12px;
    }

    .card-prediction {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.8;
      white-space: pre-line;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #1f2937;
      flex-wrap: wrap;
      gap: 8px;
    }

    .confidence-stars {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #fbbf24;
    }

    .star {
      font-size: 14px;
    }

    .star.dim {
      color: #334155;
    }

    .odds-badge {
      padding: 4px 10px;
      background: rgba(34, 197, 94, 0.1);
      border-radius: 6px;
      font-size: 12px;
      color: #22c55e;
      font-weight: 600;
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .no-results .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .no-results p {
      font-size: 14px;
      line-height: 1.6;
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .loading-spinner .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1f2937;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .container { padding: 15px; }
      .card-match { font-size: 16px; }
      .card-prediction { font-size: 13px; }
    }
  </style>
</head>

<body>

<header>
  <h1>📊 Tips & Predictions</h1>
  <a href="/" class="back-btn">← Back to Home</a>
</header>

<div class="container">

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterPredictions('all')">All</button>
    <button class="filter-tab" onclick="filterPredictions('Football')">⚽ Football</button>
    <button class="filter-tab" onclick="filterPredictions('Recap')">📋 Recaps</button>
    <button class="filter-tab" onclick="filterPredictions('Preview')">🔮 Previews</button>
  </div>

  <div id="predictionsContainer">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Loading predictions...</p>
    </div>
  </div>

</div>

<script>
  let allPredictions = [];

  async function loadPredictions() {
    const container = document.getElementById("predictionsContainer");
    try {
      const res = await fetch("/api/supabase/predictions");
      const data = await res.json();
      allPredictions = (data.predictions || []).sort((a, b) => {
        return new Date(b.match_date || b.created_at || 0) - new Date(a.match_date || a.created_at || 0);
      });

      if (allPredictions.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <div class="icon">🏟️</div>
            <p><strong>No predictions yet</strong></p>
            <p>Our analysts are working on the latest match previews and tips.<br>Check back soon — new content drops every Monday, Wednesday, and Friday.</p>
          </div>
        `;
        return;
      }

      renderPredictions(allPredictions);
    } catch (e) {
      console.error("Failed to load predictions:", e);
      container.innerHTML = `
        <div class="no-results">
          <div class="icon">⚠️</div>
          <p>Unable to load predictions right now.</p>
          <p>Please try again later.</p>
        </div>
      `;
    }
  }

  function renderPredictions(predictions) {
    const container = document.getElementById("predictionsContainer");

    if (predictions.length === 0) {
      container.innerHTML = `
        <div class="no-results">
          <div class="icon">🔍</div>
          <p>No predictions match this filter.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = predictions.map(p => {
      // Determine badge type
      const matchName = (p.match_name || "").toLowerCase();
      let badgeClass = "badge-preview";
      let badgeText = "Preview";
      if (matchName.includes("recap")) {
        badgeClass = "badge-recap";
        badgeText = "Recap";
      } else if (p.prediction && p.prediction.length > 500) {
        badgeClass = "badge-weekend";
        badgeText = "Weekend Preview";
      }

      // Confidence stars
      const confidence = p.confidence || 3;
      const stars = [1,2,3,4,5].map(i => 
        `<span class="star${i > confidence ? ' dim' : ''}">★</span>`
      ).join("");

      // Date
      const date = p.match_date 
        ? new Date(p.match_date).toLocaleDateString("en-US", { 
            weekday: "long", month: "long", day: "numeric" 
          })
        : "Date TBD";

      // Prediction text (show full on this page)
      const predictionText = p.prediction || "Analysis coming soon...";

      return `
        <div class="prediction-card" data-sport="${p.sport || 'Football'}" data-type="${badgeText}">
          <div class="card-header">
            <span class="card-date">${date}</span>
            <span class="card-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="card-match">${p.match_name || "Upcoming Fixture"}</div>
          <div class="card-league">${p.league || ""} ${p.sport ? "· " + p.sport : ""}</div>
          <div class="card-prediction">${predictionText}</div>
          <div class="card-footer">
            <div class="confidence-stars">
              Confidence: ${stars}
            </div>
            ${p.odds && p.odds !== "N/A" ? `<span class="odds-badge">Odds: ${p.odds}</span>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  function filterPredictions(filter) {
    // Update active tab
    document.querySelectorAll(".filter-tab").forEach(tab => tab.classList.remove("active"));
    event.target.classList.add("active");

    let filtered;
    switch(filter) {
      case "Football":
        filtered = allPredictions.filter(p => (p.sport || "").toLowerCase() === "football");
        break;
      case "Recap":
        filtered = allPredictions.filter(p => (p.match_name || "").toLowerCase().includes("recap"));
        break;
      case "Preview":
        filtered = allPredictions.filter(p => !(p.match_name || "").toLowerCase().includes("recap"));
        break;
      default:
        filtered = allPredictions;
    }

    renderPredictions(filtered);
  }

  // Load on page open
  loadPredictions();
</script>

</body>
  </html>
