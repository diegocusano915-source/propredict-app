<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPredict News | Real Football Intelligence</title>
    <meta name="description" content="AI-written football news generated from real match data across 20+ leagues. Real scores, real standings, zero fabrication.">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root { --glow-cyan: #00f5ff; --glow-purple: #9c27b0; --ink: #a0b3d9; }
        body { background: #070b14; }

        .glow-bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.20; }
        .orb-1 { width: 520px; height: 520px; background: var(--glow-cyan); top: -160px; left: -140px; animation: drift1 19s ease-in-out infinite alternate; }
        .orb-2 { width: 460px; height: 460px; background: var(--glow-purple); bottom: -180px; right: -120px; animation: drift2 23s ease-in-out infinite alternate; }
        .orb-3 { width: 320px; height: 320px; background: #ff2d78; top: 30%; left: 55%; opacity: 0.09; animation: drift1 27s ease-in-out infinite alternate-reverse; }
        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(70px, 40px) scale(1.15); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-80px, -30px) scale(0.95); } }

        .page-wrap { position: relative; z-index: 1; }

        .news-header { padding: 70px 20px 26px; text-align: center; }
        .header-pulse {
            width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 22px;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            background: linear-gradient(140deg, rgba(0,245,255,0.12), rgba(156,39,176,0.12));
            border: 1px solid rgba(0,245,255,0.35);
            animation: pulseGlow 3.2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 26px rgba(0,245,255,0.18), inset 0 0 18px rgba(0,245,255,0.06); }
            50% { box-shadow: 0 0 48px rgba(0,245,255,0.4), 0 0 70px rgba(156,39,176,0.2), inset 0 0 26px rgba(0,245,255,0.12); }
        }
        .news-header h1 {
            font-size: 3rem; letter-spacing: -0.02em; margin-bottom: 12px;
            background: linear-gradient(120deg, #fff 10%, var(--glow-cyan) 55%, var(--glow-purple) 95%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 26px rgba(0,245,255,0.25));
        }
        .news-header p { color: var(--ink); font-size: 1.05rem; max-width: 640px; margin: 0 auto; line-height: 1.7; }
        .live-dot {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
            padding: 7px 18px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase; color: #7ff0c5;
            background: rgba(127,240,197,0.07); border: 1px solid rgba(127,240,197,0.3);
        }
        .live-dot::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%; background: #7ff0c5;
            box-shadow: 0 0 10px #7ff0c5; animation: blink 1.6s ease-in-out infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px; margin: 20px 5% 4px;
            color: var(--ink); text-decoration: none; font-size: 0.9rem; font-weight: 600;
            padding: 8px 16px; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px;
            background: rgba(255,255,255,0.03); transition: all 0.3s;
        }
        .back-link:hover { color: var(--glow-cyan); border-color: rgba(0,245,255,0.5); box-shadow: 0 0 18px rgba(0,245,255,0.25); }

        /* Filters */
        .filter-bar {
            max-width: 1400px; margin: 18px auto 0; padding: 0 5%;
            display: flex; flex-direction: column; gap: 14px;
        }
        .chip-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .chip-row-label { color: #5d6f95; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
        .filter-chip {
            padding: 7px 16px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
            color: #8fa5cc; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09);
            cursor: pointer; transition: all 0.25s;
        }
        .filter-chip:hover { color: #fff; border-color: rgba(0,245,255,0.4); }
        .filter-chip.active {
            color: #061018; background: linear-gradient(120deg, var(--glow-cyan), #6ee7ff);
            border-color: transparent; box-shadow: 0 0 20px rgba(0,245,255,0.35);
        }
        .search-box {
            max-width: 420px; width: 100%; padding: 11px 18px; border-radius: 999px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09);
            color: #fff; font-size: 0.9rem; outline: none; transition: all 0.3s;
        }
        .search-box:focus { border-color: rgba(0,245,255,0.55); box-shadow: 0 0 22px rgba(0,245,255,0.18); }
        .search-box::placeholder { color: #5d6f95; }

        .news-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px; padding: 30px 5% 40px; max-width: 1400px; margin: 0 auto;
        }

        .news-card {
            position: relative; border-radius: 22px; cursor: pointer; overflow: hidden;
            background: linear-gradient(160deg, rgba(16,22,40,0.9), rgba(10,14,26,0.95));
            border: 1px solid rgba(255,255,255,0.07);
            transition: transform 0.35s, border-color 0.35s, box-shadow 0.35s;
            display: flex; flex-direction: column;
        }
        .news-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--glow-cyan), var(--glow-purple), transparent);
            opacity: 0; transition: opacity 0.35s;
        }
        .news-card:hover {
            transform: translateY(-6px); border-color: rgba(0,245,255,0.45);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 34px rgba(0,245,255,0.14);
        }
        .news-card:hover::after { opacity: 1; }
        .news-card-body { padding: 26px; flex: 1; display: flex; flex-direction: column; }
        .news-card-league {
            display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
            padding: 5px 14px; border-radius: 999px; font-size: 0.74rem; font-weight: 700;
            letter-spacing: 0.04em; margin-bottom: 14px;
            background: rgba(0,245,255,0.08); border: 1px solid rgba(0,245,255,0.3); color: var(--glow-cyan);
        }
        .news-card h2 { color: #fff; font-size: 1.28rem; line-height: 1.45; margin-bottom: 12px; }
        .news-card-meta { color: #5d6f95; font-size: 0.78rem; display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
        .news-card-meta .views { color: #7ff0c5; font-weight: 600; }
        .news-card-summary { color: var(--ink); font-size: 0.92rem; line-height: 1.65; flex: 1; }
        .read-more { display: inline-block; margin-top: 16px; color: var(--glow-cyan); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.04em; }
        .news-card:hover .read-more { text-shadow: 0 0 16px rgba(0,245,255,0.6); }

        .load-more-wrap { text-align: center; padding: 0 20px 70px; }
        .load-more {
            padding: 14px 38px; border-radius: 14px; cursor: pointer; font-weight: 800;
            font-size: 0.82rem; letter-spacing: 0.05em; color: var(--glow-cyan);
            background: linear-gradient(135deg, rgba(0,245,255,0.12), rgba(156,39,176,0.12));
            border: 1px solid rgba(0,245,255,0.4); transition: all 0.3s;
        }
        .load-more:hover { box-shadow: 0 0 26px rgba(0,245,255,0.35); transform: translateY(-2px); }
        .load-more[disabled] { opacity: 0.4; cursor: not-allowed; }

        .news-loading, .news-error { text-align: center; padding: 100px 20px; color: var(--ink); grid-column: 1 / -1; }
        .news-error { color: #ef4444; }
        .loading-pulse {
            display: inline-block; width: 54px; height: 54px; border-radius: 50%;
            border: 3px solid rgba(0,245,255,0.15); border-top-color: var(--glow-cyan);
            animation: spin 0.9s linear infinite; box-shadow: 0 0 22px rgba(0,245,255,0.25);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .news-header h1 { font-size: 2.1rem; }
            .news-grid { grid-template-columns: 1fr; padding: 22px 20px 40px; }
        }
    </style>
</head>
<body>
    <div class="glow-bg"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div><div class="glow-orb orb-3"></div></div>

    <div class="page-wrap">
        <div class="news-header">
            <div class="header-pulse">⚽</div>
            <h1>ProPredict News Desk</h1>
            <p>Real football intelligence — every article is written from live match data across 20+ leagues: real scores, real standings, real head-to-head records. Zero fabrication, zero filler.</p>
            <span class="live-dot">Auto-published from real fixtures 3–4× weekly</span>
        </div>

        <a href="/" class="back-link">← Back to ProPredict</a>

        <div class="filter-bar">
            <input type="text" class="search-box" id="news-search" placeholder="Search articles, teams, leagues…" />
            <div class="chip-row" id="league-chips">
                <span class="chip-row-label">League</span>
                <div class="filter-chip active" data-league="">All Leagues</div>
            </div>
        </div>

        <div id="news-container" class="news-grid">
            <div class="news-loading"><div class="loading-pulse"></div></div>
        </div>

        <div class="load-more-wrap">
            <button class="load-more" id="load-more">LOAD MORE REPORTS</button>
        </div>
    </div>

    <script>
        const state = { page: 1, league: '', search: '', hasMore: true, loading: false };
        let searchTimer = null;

        function cardHTML(a) {
            return `
                <div class="news-card" onclick="window.location.href='/news-article.html?slug=${a.slug}'">
                    <div class="news-card-body">
                        <span class="news-card-league">${a.league?.flag || '⚽'} ${a.league?.name || 'Football'}</span>
                        <h2>${a.title}</h2>
                        <div class="news-card-meta">
                            <span>📅 ${a.date}</span>
                            <span>⏱️ ${a.readTime || '5 min'}</span>
                            <span class="views">👁️ ${(a.views || 0).toLocaleString()} reads</span>
                        </div>
                        <p class="news-card-summary">${a.summary || ''}</p>
                        <span class="read-more">READ THE FULL REPORT →</span>
                    </div>
                </div>`;
        }

        async function loadNews(reset) {
            if (state.loading) return;
            state.loading = true;
            const container = document.getElementById('news-container');
            const loadMore = document.getElementById('load-more');

            if (reset) {
                state.page = 1;
                state.hasMore = true;
                container.innerHTML = '<div class="news-loading"><div class="loading-pulse"></div></div>';
            }

            try {
                const params = new URLSearchParams({ page: state.page, limit: 12 });
                if (state.league) params.set('league', state.league);
                if (state.search) params.set('search', state.search);
                const res = await fetch('/news?' + params);
                const data = await res.json();
                const articles = data.articles || [];

                if (reset) container.innerHTML = '';
                if (articles.length === 0 && state.page === 1) {
                    container.innerHTML = '<div class="news-error">No articles yet. The desk publishes automatically 3–4 times a week from real fixture data — check back soon.</div>';
                    state.hasMore = false;
                } else {
                    container.insertAdjacentHTML('beforeend', articles.map(cardHTML).join(''));
                    state.hasMore = state.page < (data.pagination?.totalPages || 1);
                }
                loadMore.disabled = !state.hasMore;
                loadMore.textContent = state.hasMore ? 'LOAD MORE REPORTS' : 'END OF THE WIRE';
                state.page++;
            } catch (e) {
                console.error('News load failed:', e);
                if (reset) container.innerHTML = '<div class="news-error">Failed to load articles. Please try again later.</div>';
            } finally {
                state.loading = false;
            }
        }

        async function loadLeagueChips() {
            try {
                const res = await fetch('/news/leagues');
                const data = await res.json();
                const row = document.getElementById('league-chips');
                (data.leagues || []).forEach(l => {
                    const chip = document.createElement('div');
                    chip.className = 'filter-chip';
                    chip.dataset.league = l.name;
                    chip.textContent = `${l.flag || '⚽'} ${l.name}`;
                    chip.onclick = () => {
                        document.querySelectorAll('#league-chips .filter-chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        state.league = l.name;
                        loadNews(true);
                    };
                    row.appendChild(chip);
                });
            } catch (e) { console.log('League chips failed:', e); }
        }

        document.getElementById('load-more').addEventListener('click', () => loadNews(false));
        document.getElementById('news-search').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { state.search = e.target.value.trim(); loadNews(true); }, 400);
        });
        document.querySelector('#league-chips .filter-chip').onclick = function () {
            document.querySelectorAll('#league-chips .filter-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            state.league = '';
            loadNews(true);
        };

        loadLeagueChips();
        loadNews(true);
    </script>
</body>
</html>
