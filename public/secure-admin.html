<!DOCTYPE html>
<html>
<head>
  <title>ProPredict Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #0a0e1a; color: #fff; padding: 20px; font-family: sans-serif; }
    table { width: 100%; border-collapse: collapse; background: #111; border-radius: 12px; overflow: hidden; margin-top: 10px; }
    th { background: #1a1a3a; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #222; }
    .btn { background: #00f5ff; color: #000; padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; }
    .stat { background: #111; padding: 20px; border-radius: 12px; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
    .stat-value { font-size: 48px; font-weight: bold; color: #00f5ff; }
    .role-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .role-free { background: rgba(255,255,255,0.1); color: #a0b3d9; }
    .role-pro { background: rgba(0, 245, 255, 0.15); color: #00f5ff; }
    .role-admin { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
    .status-active { color: #22c55e; }
    .status-inactive { color: #6b7da3; }
    .refresh-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #00f5ff;
      color: #000;
      padding: 15px 25px;
      border-radius: 50px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,245,255,0.3);
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7da3;
    }
  </style>
</head>
<body>
  <h1>🔐 ProPredict Admin</h1>
  
  <div class="stats-grid">
    <div class="stat">
      <h3>Total Users</h3>
      <div class="stat-value" id="totalUsers">-</div>
    </div>
    <div class="stat">
      <h3>Active Subs</h3>
      <div class="stat-value" id="activeSubscriptions">-</div>
    </div>
    <div class="stat">
      <h3>Visitors</h3>
      <div class="stat-value" id="totalVisitors">-</div>
    </div>
  </div>

  <h2>📊 All Users (<span id="userCount">0</span>)</h2>
  <div id="usersLoading" class="loading">Loading users...</div>
  <table id="usersTable" style="display:none;">
    <thead>
      <tr><th>Email</th><th>Role</th><th>Status</th><th>Joined</th></tr>
    </thead>
    <tbody id="usersBody"></tbody>
  </table>

  <h2 style="margin-top:30px;">🌐 Recent Visitors - IP Logs (<span id="logCount">0</span>)</h2>
  <div id="logsLoading" class="loading">Loading IP logs...</div>
  <table id="logsTable" style="display:none;">
    <thead>
      <tr><th>Time</th><th>IP</th><th>Device</th><th>Page</th></tr>
    </thead>
    <tbody id="logsBody"></tbody>
  </table>

  <button class="refresh-btn" onclick="loadAllData()">🔄 Refresh Data</button>

  <script>
    async function loadAllData() {
      await loadUsers();
      await loadIPLogs();
      await loadStats();
    }
    
    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('totalUsers').textContent = data.totalUsers || 0;
          document.getElementById('activeSubscriptions').textContent = data.activeSubscriptions || 0;
          document.getElementById('totalVisitors').textContent = data.totalVisitors || 0;
        }
      } catch(e) {
        console.error('Stats error:', e);
      }
    }
    
    async function loadUsers() {
      const loading = document.getElementById('usersLoading');
      const table = document.getElementById('usersTable');
      const body = document.getElementById('usersBody');
      const countSpan = document.getElementById('userCount');
      
      loading.style.display = 'block';
      table.style.display = 'none';
      
      try {
        const res = await fetch('/api/admin/users');
        if (!res.ok) throw new Error('Failed to fetch users');
        
        const data = await res.json();
        const users = data.users || [];
        
        countSpan.textContent = users.length;
        document.getElementById('totalUsers').textContent = users.length;
        
        body.innerHTML = '';
        
        if (users.length === 0) {
          body.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;">No users found</td></tr>';
        } else {
          users.forEach(u => {
            const row = document.createElement('tr');
            
            const roleClass = u.role === 'admin' ? 'role-admin' : (u.role === 'pro' ? 'role-pro' : 'role-free');
            const statusClass = u.subscription_status === 'active' ? 'status-active' : 'status-inactive';
            const joinDate = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown';
            
            row.innerHTML = `
              <td>${u.email || 'Unknown'}</td>
              <td><span class="role-badge ${roleClass}">${u.role || 'free'}</span></td>
              <td><span class="${statusClass}">${u.subscription_status || 'inactive'}</span></td>
              <td>${joinDate}</td>
            `;
            body.appendChild(row);
          });
        }
        
        loading.style.display = 'none';
        table.style.display = 'table';
      } catch(e) {
        console.error('Users error:', e);
        loading.textContent = 'Error loading users: ' + e.message;
      }
    }
    
    async function loadIPLogs() {
      const loading = document.getElementById('logsLoading');
      const table = document.getElementById('logsTable');
      const body = document.getElementById('logsBody');
      const countSpan = document.getElementById('logCount');
      
      loading.style.display = 'block';
      table.style.display = 'none';
      
      try {
        const res = await fetch('/api/admin/ip-logs');
        if (!res.ok) throw new Error('Failed to fetch IP logs');
        
        const data = await res.json();
        const logs = data.logs || [];
        
        countSpan.textContent = logs.length;
        document.getElementById('totalVisitors').textContent = logs.length;
        
        body.innerHTML = '';
        
        if (logs.length === 0) {
          body.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;">No IP logs yet</td></tr>';
        } else {
          logs.slice(0, 50).forEach(l => {
            const row = document.createElement('tr');
            const time = l.created_at ? new Date(l.created_at).toLocaleString('en-US', { 
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            }) : 'Unknown';
            const deviceIcon = l.device_type === 'mobile' ? '📱' : (l.device_type === 'tablet' ? '📟' : '💻');
            
            row.innerHTML = `
              <td>${time}</td>
              <td>${l.ip_address || 'Unknown'}</td>
              <td>${deviceIcon} ${l.device_type || 'desktop'}</td>
              <td>${l.page_visited || '/'}</td>
            `;
            body.appendChild(row);
          });
        }
        
        loading.style.display = 'none';
        table.style.display = 'table';
      } catch(e) {
        console.error('IP logs error:', e);
        loading.textContent = 'Error loading IP logs: ' + e.message;
      }
    }
    
    // Load everything on page load
    loadAllData();
  </script>
</body>
                                              </html>
