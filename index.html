<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ProPredict Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    header {
      background: #111827;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border-bottom: 2px solid #16a34a;
    }

    .container {
      padding: 20px;
    }

    h3 {
      margin-bottom: 12px;
      color: #22c55e;
    }

    /* ========== PREDICTIONS SECTION ========== */
    .predictions-section {
      margin-bottom: 30px;
    }

    .predictions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .prediction-card {
      background: #111827;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      transition: 0.2s;
    }

    .prediction-card:hover {
      border-color: #22c55e;
    }

    .prediction-date {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .prediction-match {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .prediction-league {
      font-size: 12px;
      color: #22c55e;
      margin-bottom: 10px;
    }

    .prediction-text {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .prediction-confidence {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #fbbf24;
    }

    .confidence-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
    }

    .confidence-dot.dim {
      background: #334155;
    }

    .view-all-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #22c55e;
      color: #000;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }

    .view-all-btn:hover {
      background: #16a34a;
    }

    .no-predictions {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }

    /* ========== EXISTING STYLES ========== */
    .league-tabs {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .league-tab {
      padding: 8px 16px;
      background: #1e293b;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
      white-space: nowrap;
    }

    .league-tab:hover {
      background: #22c55e;
      color: #000;
    }

    .match-card {
      background: #111827;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      cursor: pointer;
    }

    .league {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .teams {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .status {
      font-size: 13px;
      margin-bottom: 4px;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
      color: #22c55e;
    }

    .live-badge {
      background: red;
      color: white;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 11px;
      margin-left: 6px;
    }

    #matchModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      overflow: auto;
      z-index: 1000;
    }

    .modal-content {
      background: #111827;
      padding: 20px;
      border-radius: 10px;
      max-width: 750px;
      margin: auto;
    }

    .close-btn {
      padding: 8px 12px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .stat-section {
      margin-bottom: 15px;
    }

    .stat-section h4 {
      margin-bottom: 6px;
      color: #22c55e;
    }

    @media (max-width: 600px) {
      .predictions-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  ⚽ ProPredict Football Engine
</header>

<div class="container">

  <!-- ========== LATEST PREDICTIONS ========== -->
  <div class="predictions-section">
    <h3>🔥 Latest Predictions</h3>
    <div class="predictions-grid" id="predictionsGrid">
      <div class="no-predictions">Loading predictions...</div>
    </div>
    <a href="/tips.html" class="view-all-btn">View All Tips →</a>
  </div>

  <h3>🔥 Live Matches</h3>
  <div id="liveMatches">Loading live matches...</div>

  <h3 style="margin-top:25px;">🏆 Leagues</h3>
  <div class="league-tabs">
    <div class="league-tab" onclick="loadLeague(39)">Premier League</div>
    <div class="league-tab" onclick="loadLeague(140)">La Liga</div>
    <div class="league-tab" onclick="loadLeague(135)">Serie A</div>
    <div class="league-tab" onclick="loadLeague(78)">Bundesliga</div>
    <div class="league-tab" onclick="loadLeague(61)">Ligue 1</div>
  </div>

  <h3 style="margin-top:25px;">🏆 League Fixtures</h3>
  <div id="leagueMatches"></div>

</div>

<div id="matchModal">
  <div class="modal-content">
    <h3>Match Analysis</h3>
    <div id="analysisContent">Loading...</div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  // ========== LOAD PREDICTIONS ==========
  async function loadPredictions() {
    const grid = document.getElementById("predictionsGrid");
    try {
      const res = await fetch("/api/supabase/predictions");
      const data = await res.json();
      const predictions = data.predictions || [];

      if (predictions.length === 0) {
        grid.innerHTML = '<div class="no-predictions">No predictions yet. Check back soon for expert tips!</div>';
        return;
      }

      // Show latest 3 predictions
      const latest = predictions.slice(-3).reverse();
      grid.innerHTML = latest.map(p => {
        const confidence = p.confidence || 3;
        const dots = [1,2,3,4,5].map(i => 
          `<span class="confidence-dot${i > confidence ? ' dim' : ''}"></span>`
        ).join("");

        const date = p.match_date ? new Date(p.match_date).toLocaleDateString("en-US", { 
          weekday: "short", month: "short", day: "numeric" 
        }) : "Upcoming";

        const preview = p.prediction ? p.prediction.substring(0, 200) + "..." : "Analysis coming soon...";

        return `
          <div class="prediction-card">
            <div class="prediction-date">${date}</div>
            <div class="prediction-match">${p.match_name || "Upcoming Fixture"}</div>
            <div class="prediction-league">${p.league || "Football"} ${p.sport ? "· " + p.sport : ""}</div>
            <div class="prediction-text">${preview}</div>
            <div class="prediction-confidence">
              Confidence: ${dots}
            </div>
          </div>
        `;
      }).join("");

    } catch (e) {
      console.error("Failed to load predictions:", e);
      grid.innerHTML = '<div class="no-predictions">Unable to load predictions right now.</div>';
    }
  }

  // ========== EXISTING FUNCTIONS ==========
  async function loadTodayMatches() {
    const response = await fetch("/api/matches");
    const data = await response.json();
    displayMatches(data.response || [], "liveMatches");
  }

  async function loadLeague(id) {
    const response = await fetch(`/api/league/${id}`);
    const data = await response.json();
    displayMatches(data.response || [], "leagueMatches");
  }

  function displayMatches(matches, targetId) {
    const container = document.getElementById(targetId);
    container.innerHTML = "";

    matches.forEach(match => {
      container.innerHTML += `
        <div class="match-card" onclick="openMatch(${match.teams.home.id}, ${match.teams.away.id})">
          <div class="league">${match.league?.name || ""}</div>
          <div class="teams">${match.teams?.home?.name || ""} vs ${match.teams?.away?.name || ""}</div>
          <div class="status">
            ${match.fixture?.status?.long || ""}
            ${match.fixture?.status?.short !== "NS" && match.fixture?.status?.short !== "FT"
              ? '<span class="live-badge">LIVE</span>'
              : ''}
          </div>
          <div class="score">${match.goals?.home ?? "-"} - ${match.goals?.away ?? "-"}</div>
        </div>
      `;
    });
  }

  async function openMatch(homeId, awayId) {
    document.getElementById("matchModal").style.display = "block";
    document.getElementById("analysisContent").innerHTML = "Loading...";

    const homeRes = await fetch(`/api/team/${homeId}`);
    const homeData = await homeRes.json();

    const awayRes = await fetch(`/api/team/${awayId}`);
    const awayData = await awayRes.json();

    function calculate(matches, teamId) {
      let scored = 0, conceded = 0, over15 = 0, over25 = 0, over35 = 0, under25 = 0, btts = 0, wins = 0, draws = 0;

      matches.forEach(m => {
        const isHome = m.teams.home.id === teamId;
        const gs = isHome ? m.goals.home : m.goals.away;
        const gc = isHome ? m.goals.away : m.goals.home;

        scored += gs;
        conceded += gc;

        const total = m.goals.home + m.goals.away;

        if (total > 1) over15++;
        if (total > 2) over25++;
        if (total > 3) over35++;
        if (total < 3) under25++;
        if (m.goals.home > 0 && m.goals.away > 0) btts++;
        if (gs > gc) wins++;
        if (gs === gc) draws++;
      });

      return {
        avgScored: (scored / matches.length).toFixed(2),
        over15: Math.round((over15 / matches.length) * 100),
        over25: Math.round((over25 / matches.length) * 100),
        over35: Math.round((over35 / matches.length) * 100),
        under25: Math.round((under25 / matches.length) * 100),
        btts: Math.round((btts / matches.length) * 100),
        winRate: Math.round((wins / matches.length) * 100),
        drawRate: Math.round((draws / matches.length) * 100)
      };
    }

    const homeStats = calculate(homeData.response || [], homeId);
    const awayStats = calculate(awayData.response || [], awayId);

    document.getElementById("analysisContent").innerHTML = `
      <div class="stat-section">
        <h4>Goal Markets</h4>
        <div>Over 1.5: ${(homeStats.over15 + awayStats.over15)/2}%</div>
        <div>Over 2.5: ${(homeStats.over25 + awayStats.over25)/2}%</div>
        <div>Over 3.5: ${(homeStats.over35 + awayStats.over35)/2}%</div>
        <div>Under 2.5: ${(homeStats.under25 + awayStats.under25)/2}%</div>
        <div>BTTS: ${(homeStats.btts + awayStats.btts)/2}%</div>
      </div>

      <div class="stat-section">
        <h4>Match Tendencies</h4>
        <div>Home Win Rate: ${homeStats.winRate}%</div>
        <div>Away Win Rate: ${awayStats.winRate}%</div>
        <div>Draw Probability: ${(homeStats.drawRate + awayStats.drawRate)/2}%</div>
      </div>
    `;
  }

  function closeModal() {
    document.getElementById("matchModal").style.display = "none";
  }

  // ========== INIT ==========
  loadPredictions();
  loadTodayMatches();
  loadLeague(39);
</script>

</body>
      </html>
